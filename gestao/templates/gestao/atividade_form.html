{% extends "base.html" %}
{% block titulo %}{% if atividade %}Editar atividade{% else %}Nova atividade{% endif %}{% endblock %}
{% block conteudo %}
<h1>{% if atividade %}Editar atividade{% else %}Nova atividade{% endif %}</h1>
<section class="cartao">
  <form method="post" class="formulario" novalidate>
    {% csrf_token %}
    {{ form.as_div }}
    <div class="acoes">
      <button type="submit">Salvar</button>
      <a class="botao secundario" href="{% url 'atividade_lista' %}">Cancelar</a>
    </div>
  </form>
</section>
{% endblock %}
